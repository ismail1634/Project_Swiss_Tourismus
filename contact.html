<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Swiss Tourist Advisor</title>
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <div class="page-wrapper">
    <h1>SWISS TOURIST ADVISOR</h1>

    <div class="back-home">
      <a href="index.html" class="back-button">← Home</a>
    </div>

    <section class="contact-section">
      <h2>Contact Us</h2>
      <p>Have a question or need travel advice? Send us a message below!</p>

      <form id="contact-form" action="https://formspree.io/f/mzzkbdrv" method="POST">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" name="_replyto" required>
        </div>

        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <button type="submit" id="submit-btn">Send Message</button>
        <p id="form-status"></p>
      </form>
    </section>
  </div>

  <script>
    const form = document.getElementById("contact-form");
    const status = document.getElementById("form-status");
    const button = document.getElementById("submit-btn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.textContent = "Sending...";
      button.disabled = true;
      const data = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: form.method,
          body: data,
          headers: { 'Accept': 'application/json' }
        });
        if (response.ok) {
          status.textContent = "✅ Thank you! Your message has been sent.";
          form.reset();
        } else {
          status.textContent = "⚠️ Oops! Something went wrong.";
        }
      } catch (error) {
        status.textContent = "⚠️ Network error. Please try again later.";
      }
      button.textContent = "Send Message";
      button.disabled = false;
    });
  </script>
</body>
</html>
