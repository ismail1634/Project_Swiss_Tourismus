<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swiss Tourist Advisor</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  </head>
<body>
  <div class="page-wrapper">
    <h1>SWISS TOURIST ADVISOR</h1>
    <nav>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="https://traveldestination.org/" target="_blank" rel="noopener noreferrer">Tipps</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>

    <p>Smart travel suggestions based on real-time weather in Switzerland.</p>

    <div class="controls-layout">
      <div class="input-group">
        <select id="citySelector">
          <option value="Zurich">Zurich</option>
          <option value="Geneva">Geneva</option>
          <option value="Lucerne">Lucerne</option>
          <option value="Bern">Bern</option>
          <option value="Interlaken">Interlaken</option>
        </select>
        <button id="recommendBtn">Get Recommendations</button>
      </div>

      <div id="weatherBox">
        <span id="weatherIcon"></span>
        <span id="weatherText"></span>
      </div>
    </div>

    <div class="map-layout">
      <div id="map"></div>

      <div id="activityBox">
        <h3>Suggested Activities</h3>
        <ul id="activityList"></ul>
      </div>
    </div>

    <footer>
      <p>© 2025 Swiss Tourist Advisor | Built with ❤️ in Switzerland</p>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>

</html>
